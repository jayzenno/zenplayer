name: UI Instrumentation (non-gating)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-instrumentation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble instrumentation test APK
        run: gradle assembleDebug assembleDebugAndroidTest --stacktrace
