name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare ZenPlayer TV shell
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('app/src/main/java/com/zenplayer/tv/ZenPlayerShell.kt')
          s = p.read_text()
          s = s.replace('info.activityInfo.packageManager', 'LocalContext.current.packageManager')
          s = s.replace('Sidebar(page, accent) { page = it }', 'ZenSidebar(page, accent, settings) { page = it }')
          s = s.replace('0 -> HomeScreen(store, accent, refresh) { playing = it }', '0 -> ZenHomeScreen(store, accent, refresh, { playing = it }) { page = 2 }')
          p.write_text(s)
          PY2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zenplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
