name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare TV focus and glass behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/zenplayer/tv/ZenPlayerShell.kt')
          s = p.read_text()
          s = s.replace('if (index == 0) Modifier.focusRequester(requester)', 'if (index == page) Modifier.focusRequester(requester)')
          s = s.replace('val ui = settings.ui', 'val ui = settings.ui\n    ZenGlass.intensity = ui.glassIntensity')
          s = s.replace('private val Surface = Color.White.copy(alpha = .055f)', 'private val Surface: Color get() = ZenGlass.surface()')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zenplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
